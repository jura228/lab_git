<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторна робота 6: Маніпуляція DOM та обробка подій</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Маніпуляція DOM та обробка подій</h1>
  </header>

  <main>
    <section id="change-section">
      <h2>Зміна вмісту елемента</h2>
      <p id="text">Це початковий текст.</p>
      <button id="change-btn">Змінити текст</button>
    </section>

    <section id="events-section">
      <h2>Обробка подій</h2>
      <button id="hover-btn">Наведіть курсор на мене</button>
      <p id="hover-text">Наведіть курсор на кнопку – ви побачите зміну стилю.</p>
    </section>

    <section id="add-section">
      <h2>Додавання нового елемента</h2>
      <button id="add-btn">Додати елемент</button>
      <button id="remove-btn">Видалити останній</button>
      <div id="container"></div>
    </section>

    <section id="variant-section">
      <h2>Додаткове завдання</h2>
      <button id="variant-btn">Натисніть 14 разів!</button>
      <p id="counter">Натискань: 0 / 14</p>
    </section>
  </main>

  <footer>
    <p>Лабораторна робота 6. JavaScript, DOM, події.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
